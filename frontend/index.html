<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Assessment Companion</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="navbar-brand">IB Assessment Companion</a>
            <ul class="navbar-nav">
                <li><a href="/" class="active">Dashboard</a></li>
                <li><a href="/students.html">Students</a></li>
                <li><a href="/assignments.html">Assignments</a></li>
                <li><a href="/submissions.html">Submissions</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div id="alerts"></div>

        <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
        </div>

        <!-- Stats Grid -->
        <div id="dashboard-stats" class="stats-grid">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading...</span>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Recent Submissions</h2>
            </div>
            <div id="recent-activity">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Loading...</span>
                </div>
            </div>
        </div>

        <!-- Quick Links -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Quick Actions</h2>
            </div>
            <div class="btn-group">
                <a href="/students.html" class="btn btn-primary">Manage Students</a>
                <a href="/assignments.html" class="btn btn-primary">Manage Assignments</a>
                <a href="/submissions.html" class="btn btn-success">New Submission</a>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
