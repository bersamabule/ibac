<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - IB Assessment Companion</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="navbar-brand">IB Assessment Companion</a>
            <ul class="navbar-nav">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/students.html">Students</a></li>
                <li><a href="/assignments.html" class="active">Assignments</a></li>
                <li><a href="/submissions.html">Submissions</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div id="alerts"></div>

        <div class="page-header">
            <h1 class="page-title">Assignments</h1>
            <button class="btn btn-primary" onclick="openAssignmentForm()">Add Assignment</button>
        </div>

        <div class="card">
            <!-- Assignments Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Task Type</th>
                            <th>Criteria</th>
                            <th>Date Assigned</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="assignments-table-body">
                        <tr>
                            <td colspan="6" class="loading">
                                <div class="spinner"></div>
                                <span>Loading...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit Assignment Modal -->
    <div id="assignment-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="assignment-modal-title" class="modal-title">Add Assignment</h3>
                <button class="modal-close" onclick="closeModal('assignment-modal')">&times;</button>
            </div>
            <form id="assignment-form" onsubmit="saveAssignment(event)">
                <div class="modal-body">
                    <input type="hidden" id="assignment-id">

                    <div class="form-group">
                        <label class="form-label required" for="assignment-title">Title</label>
                        <input type="text" id="assignment-title" class="form-control" required
                               placeholder="e.g., Poetry Analysis: 'The Road Not Taken'">
                    </div>

                    <div class="form-group">
                        <label class="form-label required" for="prompt-text">Prompt Text</label>
                        <textarea id="prompt-text" class="form-control" rows="4" required
                                  placeholder="Enter the full assignment prompt given to students..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label required" for="task-type">Task Type</label>
                        <select id="task-type" class="form-control" required>
                            <option value="">Select task type...</option>
                            <option value="ANALYSIS">Analysis</option>
                            <option value="COMPARATIVE">Comparative</option>
                            <option value="CREATIVE">Creative</option>
                            <option value="TRANSACTIONAL">Transactional</option>
                            <option value="INTEGRATED">Integrated</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="text-type">Text Type / Genre</label>
                        <input type="text" id="text-type" class="form-control"
                               placeholder="e.g., Literary Analysis Essay, Creative Narrative">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="source-text-info">Source Text Information</label>
                        <textarea id="source-text-info" class="form-control" rows="2"
                                  placeholder="Description of source texts used..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label required">Criteria Assessed</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="criteria" value="A">
                                <span>Criterion A</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="criteria" value="B">
                                <span>Criterion B</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="criteria" value="C">
                                <span>Criterion C</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="criteria" value="D">
                                <span>Criterion D</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="word-count-target">Target Word Count</label>
                        <input type="number" id="word-count-target" class="form-control"
                               placeholder="e.g., 500" min="1">
                    </div>

                    <div class="form-group">
                        <label class="form-label required" for="date-assigned">Date Assigned</label>
                        <input type="date" id="date-assigned" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="date-due">Due Date</label>
                        <input type="date" id="date-due" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('assignment-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Assignment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
